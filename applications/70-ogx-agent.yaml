apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhoai-demo-ogx-agent
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "70"
spec:
  project: default

  source:
    repoURL: https://github.com/vahitunal/rhoai-demo-gitops.git
    targetRevision: main
    path: components/ogx-agent

  destination:
    server: https://kubernetes.default.svc
    namespace: maas-demo

  syncPolicy:
    syncOptions:
      - ServerSideApply=true
