{
  "apiVersion": "argoproj.io/v1alpha1",
  "kind": "Application",
  "metadata": {
    "name": "rag-pgvector",
    "namespace": "openshift-gitops"
  },
  "spec": {
    "project": "default",
    "source": {
      "path": "components/rag-pgvector",
      "repoURL": "https://github.com/vahitunal/rhoai-demo-gitops.git",
      "targetRevision": "main"
    },
    "destination": {
      "namespace": "maas-demo",
      "server": "https://kubernetes.default.svc"
    },
    "syncPolicy": {
      "syncOptions": [
        "ServerSideApply=true"
      ]
    }
  }
}
