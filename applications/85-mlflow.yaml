apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhoai-demo-mlflow
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "85"
spec:
  project: default
  source:
    repoURL: https://github.com/vahitunal/rhoai-demo-gitops.git
    targetRevision: main
    path: components/mlflow
  destination:
    server: https://kubernetes.default.svc
    namespace: redhat-ods-applications
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
