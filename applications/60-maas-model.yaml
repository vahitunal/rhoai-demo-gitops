apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhoai-demo-maas-model
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "60"
spec:
  project: default

  source:
    repoURL: https://github.com/vahitunal/rhoai-demo-gitops.git
    targetRevision: main
    path: components/maas-model

  destination:
    server: https://kubernetes.default.svc
    namespace: maas-demo

  syncPolicy:
    syncOptions:
      - ServerSideApply=true
