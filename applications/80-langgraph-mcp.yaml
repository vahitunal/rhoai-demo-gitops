apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhoai-demo-langgraph-mcp
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "80"
spec:
  project: default
  source:
    repoURL: https://github.com/vahitunal/rhoai-demo-gitops.git
    targetRevision: main
    path: components/langgraph-mcp
  destination:
    server: https://kubernetes.default.svc
    namespace: maas-demo
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
