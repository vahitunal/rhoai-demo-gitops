apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rag-embedding-cache
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rag-embedding
spec:
  selector:
    app: rag-embedding
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-embedding
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rag-embedding
  template:
    metadata:
      labels:
        app: rag-embedding
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: embedding
          image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
          args:
            - --model-id
            - sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
            - --served-model-name
            - multilingual-minilm
            - --dtype
            - float32
            - --pooling
            - mean
            - --port
            - "8080"
            - --huggingface-hub-cache
            - /data
            - --tokenization-workers
            - "2"
            - --max-client-batch-size
            - "16"
            - --max-batch-tokens
            - "2048"
          env:
            - name: HF_HOME
              value: /data
            - name: OMP_NUM_THREADS
              value: "2"
            - name: MKL_NUM_THREADS
              value: "2"
            - name: RAYON_NUM_THREADS
              value: "2"
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: cache
              mountPath: /data
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: rag-embedding-cache
