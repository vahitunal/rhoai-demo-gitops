apiVersion: v1
kind: ConfigMap
metadata:
  name: ogx-agent-demo-config
  namespace: maas-demo
  labels:
    ogx.io/watch: 'true'
data:
  config.yaml: "version: \"2\"\ndistro_name: rh\n\napis:\n  - inference\n  - vector_io\n\
    \  - files\n  - file_processors\n\nproviders:\n  inference:\n    - provider_id:\
    \ maas-vllm-inference-1\n      provider_type: remote::vllm\n      config:\n  \
    \      base_url: ${env.OGX_DEMO_MAAS_BASE_URL}\n        api_token: ${env.OGX_DEMO_MAAS_TOKEN}\n\
    \        max_tokens: 256\n        tls_verify: true\n\n    - provider_id: embedding-vllm\n\
    \      provider_type: remote::vllm\n      config:\n        base_url: http://rag-embedding:8080/v1\n\
    \        refresh_models: false\n        allowed_models:\n          - multilingual-minilm\n\
    \n  vector_io:\n    - provider_id: pgvector\n      provider_type: remote::pgvector\n\
    \      config:\n        host: rag-pgvector\n        port: 5432\n        db: rag\n\
    \        user: rag\n        password: ${env.OGX_RAG_DB_PASSWORD}\n        distance_metric:\
    \ COSINE\n        pool_min_size: 1\n        pool_max_size: 5\n        persistence:\n\
    \          backend: kv_default\n          namespace: vector_io::pgvector\n   \
    \     metadata_store:\n          backend: sql_default\n          table_name: vector_store_metadata\n\
    \n  files:\n    - provider_id: localfs\n      provider_type: inline::localfs\n\
    \      config:\n        storage_dir: /.ogx/files\n        metadata_store:\n  \
    \        backend: sql_default\n          table_name: files_metadata\n\n  file_processors:\n\
    \    - provider_id: pypdf\n      provider_type: inline::pypdf\n      config:\n\
    \        default_chunk_size_tokens: 100\n        default_chunk_overlap_tokens:\
    \ 10\n\nstorage:\n  backends:\n    kv_default:\n      type: kv_postgres\n    \
    \  host: rag-pgvector\n      port: 5432\n      db: rag\n      user: rag\n    \
    \  password: ${env.OGX_RAG_DB_PASSWORD}\n    sql_default:\n      type: sql_postgres\n\
    \      host: rag-pgvector\n      port: 5432\n      db: rag\n      user: rag\n\
    \      password: ${env.OGX_RAG_DB_PASSWORD}\n  stores:\n    metadata:\n      backend:\
    \ kv_default\n      namespace: ogx_registry\n    inference:\n      backend: sql_default\n\
    \      table_name: inference_store\n\nregistered_resources:\n  models:\n    -\
    \ model_id: publishers/maas-demo/models/qwen3-maas\n      provider_id: maas-vllm-inference-1\n\
    \      model_type: llm\n\n    - model_id: multilingual-minilm\n      provider_id:\
    \ embedding-vllm\n      model_type: embedding\n      metadata:\n        embedding_dimension:\
    \ 384\n        context_length: 128\n\nvector_stores:\n  default_provider_id: pgvector\n\
    \  default_embedding_model:\n    provider_id: embedding-vllm\n    model_id: multilingual-minilm\n\
    \  file_ingestion_params:\n    default_chunk_size_tokens: 100\n    default_chunk_overlap_tokens:\
    \ 10\n\nserver:\n  port: 8321\n"
---
apiVersion: ogx.io/v1beta1
kind: OGXServer
metadata:
  name: ogx-agent-demo
  namespace: maas-demo
spec:
  distribution:
    name: rh
  network:
    port: 8321
  overrideConfig:
    name: ogx-agent-demo-config
    key: config.yaml
  workload:
    replicas: 1
    storage:
      size: 2Gi
      mountPath: /.ogx
    resources:
      requests:
        cpu: 250m
        memory: 500Mi
      limits:
        cpu: '2'
        memory: 2Gi
    overrides:
      command:
      - /bin/sh
      - -c
      - ogx run /etc/ogx/config.yaml --insecure
      env:
      - name: OGX_DEMO_MAAS_BASE_URL
        valueFrom:
          configMapKeyRef:
            name: maas-cluster-settings
            key: base-url
      - name: OGX_CONFIG_DIR
        value: /.ogx
      - name: OGX_DEMO_MAAS_TOKEN
        valueFrom:
          secretKeyRef:
            name: ogx-maas-token
            key: token
      - name: OGX_RAG_DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: rag-pgvector-auth
            key: password
