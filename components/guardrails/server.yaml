apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-pii-config
  namespace: maas-demo
data:
  config.yaml: |
    rails:
      config:
        sensitive_data_detection:
          input:
            entities:
              - EMAIL_ADDRESS
              - PHONE_NUMBER
              - CREDIT_CARD
          output:
            entities:
              - EMAIL_ADDRESS
              - PHONE_NUMBER
              - CREDIT_CARD
        regex_detection:
          input:
            patterns:
              # TCKN candidate: 11 digits, first digit nonzero. No checksum validation.
              - '(?<![0-9])[1-9][0-9]{10}(?![0-9])'
          output:
            patterns:
              - '(?<![0-9])[1-9][0-9]{10}(?![0-9])'
      input:
        flows:
          - detect sensitive data on input
          - regex check input
      output:
        flows:
          - detect sensitive data on output
          - regex check output
  rails.co: |
    # Built-in sensitive data detection flows.
---
apiVersion: trustyai.opendatahub.io/v1alpha1
kind: NemoGuardrails
metadata:
  name: agent-guardrails
  namespace: maas-demo
  annotations:
    security.opendatahub.io/enable-auth: "true"
spec:
  replicas: 1
  nemoConfigs:
    - name: agent-pii
      configMaps:
        - agent-pii-config
