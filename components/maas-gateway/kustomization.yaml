apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../cluster-settings
  - gatewayclass.yaml
  - gateway-options.yaml
  - gateway.yaml
  - route.yaml

patches:
  - target:
      kind: ConfigMap
      name: maas-cluster-settings
    patch: |-
      - op: add
        path: /metadata/namespace
        value: openshift-ingress

replacements:
  - source:
      kind: ConfigMap
      name: maas-cluster-settings
      fieldPath: data.hostname
    targets:
      - select:
          kind: Gateway
          name: maas-default-gateway
        fieldPaths:
          - spec.listeners.0.hostname
      - select:
          kind: Route
          name: maas-default-gateway
        fieldPaths:
          - spec.host
