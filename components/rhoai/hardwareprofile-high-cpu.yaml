apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  name: high-cpu
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/sync-wave: "20"
    opendatahub.io/dashboard-feature-visibility: '[]'
    opendatahub.io/disabled: "false"
    opendatahub.io/display-name: high-cpu
spec:
  identifiers:
    - defaultCount: "4"
      displayName: CPU
      identifier: cpu
      minCount: "4"
      resourceType: CPU
    - defaultCount: 16Gi
      displayName: Memory
      identifier: memory
      maxCount: 32Gi
      minCount: 16Gi
      resourceType: Memory
