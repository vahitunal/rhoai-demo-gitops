apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhoai-demo-bootstrap
  namespace: openshift-gitops
spec:
  project: default

  source:
    repoURL: https://github.com/vahitunal/rhoai-demo-gitops.git
    targetRevision: main
    path: applications
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
